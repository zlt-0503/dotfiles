# vim: ft=dosini
[Metadata]
Name=Catppuccin Mocha Blue
Version=1.0
Author=justTOBBI, Isabelinc, Kurome
Description=Catppuccin Mocha Blue Color Theme
ScaleWithDPI=True

[InputPanel]
Font=Maple Mono Normal NF CN 18
Spacing=3

# Unselected candidate color
# Base, for strong contrast on the white candidate panel
NormalColor=#1e1e2e
# Selected candidate color
# Base
HighlightCandidateColor=#1e1e2e
# Input character color
# Blue
HighlightColor=#89b4fa
# Input character background color
# Surface 0
HighlightBackgroundColor=#313244

[InputPanel/TextMargin]
Left=18
Right=18
Top=8
Bottom=8

[InputPanel/Background]
# White, intentionally contrasting with dark application themes
Color=#ffffff

# Uncomment this to switch to rounded-corner
Image=panel.svg

[InputPanel/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[InputPanel/Highlight]
# Blue
Color=#89b4fa

# Uncomment this to switch to rounded-corner
Image=highlight.svg

[InputPanel/Highlight/Margin]
Left=18
Right=18
Top=8
Bottom=8

[Menu]
Font=Maple Mono Normal NF CN 11
# Text
NormalColor=#cdd6f4
Spacing=3

[Menu/Background]
# Surface 0
Color=#313244

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
# Pink
Color=#f5c2e7

[Menu/Highlight/Margin]
Left=10
Right=10
Top=5
Bottom=5

[Menu/Separator]
# Base
Color=#1e1e2e

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
