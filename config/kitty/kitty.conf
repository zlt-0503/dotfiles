# Ported from ~/.config/alacritty/alacritty.toml

shell /bin/zsh --login
term xterm-kitty

remember_window_size no
initial_window_width 120c
initial_window_height 30c
window_padding_width 10
placement_strategy center
hide_window_decorations yes

font_family Maple Mono Normal NF CN
bold_font Maple Mono Normal NF CN Bold
italic_font Maple Mono Normal NF CN Italic
bold_italic_font Maple Mono Normal NF CN Bold Italic
font_size 12.0

background_opacity 0.85
background_blur 0

foreground #cdd6f4
background #1e1e2e

cursor #f5e0dc
cursor_text_color #1e1e2e
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0.75

selection_foreground none
selection_background #585b70

copy_on_select clipboard
mouse_hide_wait 3.0
scrollback_lines 10000
wheel_scroll_multiplier 3.0

enable_audio_bell no
visual_bell_duration 0.0

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+f search
map ctrl+shift+n new_os_window
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map shift+home scroll_home
map shift+end scroll_end
