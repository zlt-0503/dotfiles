# Window navigation
unbind 1
unbind 2
unbind 3
unbind 4
unbind 5
unbind 6
unbind 7
unbind 8
unbind 9
unbind 0

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Pane navigation
bind 1 select-pane -t:.1
bind 2 select-pane -t:.2
bind 3 select-pane -t:.3
bind 4 select-pane -t:.4
bind 5 select-pane -t:.5
bind 6 select-pane -t:.6
bind 7 select-pane -t:.7
bind 8 select-pane -t:.8
bind 9 select-pane -t:.9
bind 0 select-pane -t:.10

unbind %

bind % split-window -h -c "#{pane_current_path}"

unbind '"'

bind '"' split-window -v -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Persist sessions, windows, pane layouts, working directories and scrollback.
set -g @resurrect-capture-pane-contents 'on'

# tmux-resurrect only restarts a conservative process allow-list by default.
# Restore AppImage Neovim through its stable PATH name, and restore the Codex
# command used in the current workspace.  Do not enable the dangerous ':all:'
# mode, which could re-run arbitrary one-shot commands.
set -g @resurrect-processes '"~/.mount_nvim->nvim *" "~codex resume->codex resume"'

# Save frequently and restore once, when the first tmux server starts after
# login.  Kitty/zsh already starts or attaches to the "default" session.
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# Do not start pane processes before the graphical/login environment is ready.
set -g @continuum-boot 'off'

# Popup terminal, rooted at the first pane's current directory.
unbind t
bind -n M-t display-popup -t:.1 -d "#{pane_current_path}" -w 90% -h 80% -E
bind T clock-mode

set -g default-terminal 'tmux-256color'
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi

# Refresh graphical-session variables from each newly attached client. This
# keeps a persistent tmux server usable across Hyprland logout/login cycles.
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE XDG_SESSION_ID"

# Catppuccin Mocha inspired, kept local instead of using a theme plugin.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left-length 48
set -g status-left "#{?client_prefix,#[fg=#f38ba8],#[fg=#89b4fa]}#[bg=default,bold] #S "
set -g status-right ""
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#89b4fa,fg=#11111b,bold"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g window-status-separator ""
setw -g window-status-style "bg=default,fg=#a6adc8"
setw -g window-status-format " #I:#W "
setw -g window-status-current-style "bg=default,fg=#cdd6f4,bold"
setw -g window-status-current-format " #I:#W "
set -g status-interval 1

set -g pane-border-status top
set -g pane-border-format "#[fg=#89b4fa] #P #[fg=#6c7086]#{pane_current_command} "

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
